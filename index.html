<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geliştirici Profil Kartı - Bootstrap Butonları</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <!-- KART TASARIMI BAŞLANGICI -->
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 text-center">
                        
                        <!-- Profil Başlığı -->
                        <img src="https://ui-avatars.com/api/?name=Bilal+Demir&background=0D8ABC&color=fff&size=100" class="rounded-circle mb-3 shadow-sm" alt="Profil">
                        <h4 class="card-title fw-bold mb-1">Bilal Demir</h4>
                        <p class="text-muted mb-4">Web Geliştirici & UI Tasarımcısı</p>

                        <!-- 1. STANDART VE OUTLINE BUTONLAR (Yan Yana) -->
                        <div class="d-flex justify-content-center gap-2 mb-4">
                            <button class="btn btn-primary px-4 shadow-sm">Takip Et</button>
                            <button class="btn btn-outline-secondary px-4">Mesaj</button>
                        </div>

                        <!-- 2. BUTON GRUBU (Menü/Sekme Mantığı İçin) -->
                        <h6 class="text-start text-muted mb-2">Çalışma Alanları</h6>
                        <div class="btn-group w-100 mb-4 shadow-sm" role="group">
                            <button type="button" class="btn btn-outline-dark ">Front-end</button>
                            <button type="button" class="btn btn-outline-dark">C / Python</button>
                            <button type="button" class="btn btn-outline-dark">Tasarım</button>
                        </div>

                        <!-- 3. BOYUTLANDIRILMIŞ BUTONLAR (Small Butonlarla Etiketler) -->
                        <div class="text-start mb-4">
                            <h6 class="text-muted mb-2">Araçlar & Teknolojiler</h6>
                            <!-- İçi boş, üzerine gelince mavi renkle dolan buton -->
                            <button class="btn btn-outline-primary btn-sm mb-1">Bootstrap 5</button>
                            <button class="btn btn-outline-warning btn-sm mb-1">Photoshop</button>
                            <button class="btn btn-outline-success btn-sm mb-1">Algoritma</button>
                            <button class="btn btn-outline-secondary btn-sm mb-1">HTML/CSS</button>
                        </div>

                        <hr class="my-4">

                        <!-- 4. SATIRI KAPLAYAN BÜYÜK BUTONLAR (Grid ve Büyük/Normal Boyutlar) -->
                        <div class="d-grid gap-3">
                            <button class="btn btn-danger btn-lg shadow-sm" type="button">
                                🚀 Projeleri İncele
                            </button>
                            <button class="btn btn-light text-primary fw-medium border" type="button">
                                CV İndir
                            </button>
                        </div>

                    </div>
                </div>
                <!-- KART TASARIMI SONU -->

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
